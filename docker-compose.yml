services:
    app:
        container_name: lv-app
        image: ghcr.io/nkvtd/lazhni-vesti:latest
        ports:
            - "${PORT:-3000}:3000"
        environment:
            - NODE_ENV=production
            - PORT=3000
            - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev-secret-please-change-me-in-production}
            - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
            - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
            - OPENAI_API_KEY=${OPENAI_API_KEY}
            - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-lv-db}
            - TZ=Europe/Skopje
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    postgres:
        container_name: lv-postgres
        image: postgres:18-alpine
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
            - POSTGRES_DB=${POSTGRES_DB:-lv-db}
        volumes:
            - postgres_data:/var/lib/postgresql
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lv-db}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    postgres_data: {}

networks:
    edge-proxy:
        external: true
